<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-label="Executive portfolio banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08101c"/>
      <stop offset="50%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="560" fill="url(#bg)"/>
  <circle cx="1280" cy="120" r="170" fill="#38bdf8" opacity="0.10"/>
  <circle cx="1480" cy="360" r="240" fill="#60a5fa" opacity="0.08"/>
  <circle cx="190" cy="80" r="100" fill="#38bdf8" opacity="0.04"/>

  <rect x="72" y="64" width="1456" height="432" rx="30" fill="#0a1220" opacity="0.78" stroke="#60a5fa" stroke-opacity="0.20"/>

  <g transform="translate(120,116)">
    <rect x="0" y="0" width="190" height="190" rx="28" fill="#0f172a" stroke="#60a5fa" stroke-opacity="0.26"/>
    <path d="M44 134 L88 58 L132 134" fill="none" stroke="url(#line)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M84 102 H158" fill="none" stroke="url(#line)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="44" cy="134" r="10" fill="#38bdf8"/>
    <circle cx="132" cy="134" r="10" fill="#60a5fa"/>
  </g>

  <g transform="translate(360,128)" filter="url(#shadow)">
    <text x="0" y="0" fill="#eff6ff" font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="700">Anderson Marzola</text>
    <text x="0" y="62" fill="#bfdbfe" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">Tech Lead • .NET Architect • Senior Software Engineer</text>
    <rect x="0" y="95" width="560" height="6" rx="3" fill="url(#line)" />
    <text x="0" y="150" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="24">Enterprise applications • APIs • Azure • SQL Server • Angular</text>
    <text x="0" y="190" fill="#dbeafe" font-family="Segoe UI, Arial, sans-serif" font-size="24">Microservices • Docker • Kubernetes • CI/CD • Observability</text>

    <g transform="translate(0,240)">
      <rect x="0" y="0" width="170" height="46" rx="23" fill="#111827" stroke="#60a5fa" stroke-opacity="0.30"/>
      <text x="85" y="29" text-anchor="middle" fill="#eff6ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Since 2010</text>

      <rect x="186" y="0" width="220" height="46" rx="23" fill="#111827" stroke="#60a5fa" stroke-opacity="0.30"/>
      <text x="296" y="29" text-anchor="middle" fill="#eff6ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Cloud-Native Portfolio</text>

      <rect x="422" y="0" width="210" height="46" rx="23" fill="#111827" stroke="#60a5fa" stroke-opacity="0.30"/>
      <text x="527" y="29" text-anchor="middle" fill="#eff6ff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Architecture Focus</text>
    </g>
  </g>
</svg>
